<dialog
  #requestDialog
  class="support-request-dialog contact-modal"
  id="support-request-dialog"
  [attr.aria-labelledby]="submissionState() === 'sent' ? 'support-request-success-title' : 'support-request-title'"
  (close)="onClosed()"
  (click)="onBackdropClick($event)"
>
  <div class="contact-modal__layout" [class.contact-modal__layout--success]="submissionState() === 'sent'">
    <button
      class="policy-close contact-modal__close"
      type="button"
      aria-label="Закрити форму звернення"
      title="Закрити форму звернення"
      (click)="close()"
    >
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false">
        <path d="m6 6 12 12M18 6 6 18" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
      </svg>
    </button>

    <article class="policy-content contact-modal__panel">
      <h2 id="support-request-title" class="sr-only">Звернення до підтримки</h2>

      @if (submissionState() === 'sent') {
        <section class="submission-success" role="status" aria-live="polite">
          <svg class="submission-success__icon" viewBox="0 0 48 48" fill="none" aria-hidden="true" focusable="false">
            <circle cx="24" cy="24" r="21" stroke="currentColor" stroke-width="1.5" />
            <path d="m14 24 7 7 13-14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <h3 #successTitle id="support-request-success-title" class="submission-success__title" tabindex="-1">Повідомлення надіслано</h3>
          <p class="submission-success__message">Дякуємо за звернення! Очікуйте на відповідь на вказану електронну пошту.</p>
          <p class="submission-success__follow-up">Якщо не отримаєте відповіді, напишіть <button class="submission-manager-link" type="button" aria-haspopup="dialog" (click)="openManager()">менеджеру</button>.</p>
        </section>
      } @else {
      <form class="contact-form" [attr.aria-busy]="submissionState() === 'sending'" (submit)="submitRequest($event)">
        <div class="contact-form__grid">
          <div class="contact-input">
            <input
              id="support-full-name"
              name="fullName"
              class="contact-input__field"
              type="text"
              placeholder=" "
              autocomplete="name"
              [readOnly]="submissionState() === 'sending'"
              autofocus
              required
            >
            <label class="contact-input__label" for="support-full-name">
              Ваше ім’я та прізвище<span class="contact-input__required">*</span>
            </label>
          </div>

          <div class="contact-input contact-input--select">
            <select
              id="support-purpose"
              name="purpose"
              class="contact-input__field contact-input__select"
              [disabled]="submissionState() === 'sending'"
              required
            >
              <option value="" selected disabled hidden></option>
              <option value="consultation">Консультація</option>
              <option value="estimate">Розрахунок вартості</option>
              <option value="order">Питання щодо замовлення</option>
              <option value="other">Інше</option>
            </select>
            <label class="contact-input__label" for="support-purpose">
              Мета звернення<span class="contact-input__required">*</span>
            </label>
          </div>

          <div class="contact-input">
            <input
              id="support-email"
              name="email"
              class="contact-input__field"
              type="email"
              placeholder=" "
              autocomplete="email"
              [readOnly]="submissionState() === 'sending'"
              required
            >
            <label class="contact-input__label" for="support-email">
              Електронна пошта<span class="contact-input__required">*</span>
            </label>
          </div>

          <div class="contact-input">
            <input
              id="support-mobile"
              name="phone"
              class="contact-input__field"
              type="tel"
              placeholder=" "
              autocomplete="tel"
              [readOnly]="submissionState() === 'sending'"
            >
            <label class="contact-input__label" for="support-mobile">Номер телефону</label>
          </div>
        </div>

        <div class="contact-input contact-input--message">
          <textarea
            #requestMessage
            id="support-message"
            name="message"
            class="contact-input__field contact-input__field--textarea"
            maxlength="1500"
            placeholder=" "
            rows="5"
            [readOnly]="submissionState() === 'sending'"
            aria-describedby="support-message-counter"
            (input)="updateMessageLength(requestMessage.value)"
            required
          ></textarea>
          <label class="contact-input__label" for="support-message">
            Опишіть ваше звернення<span class="contact-input__required">*</span>
          </label>
          <span class="contact-input__counter" id="support-message-counter">{{ messageLength() }}/1500</span>
        </div>

        <div class="contact-form__footer">
          <div class="contact-form__consent">
            <div class="contact-checkbox">
              <input id="support-consent" name="informationConfirmed" type="checkbox" [disabled]="submissionState() === 'sending'" required>
              <label for="support-consent" style="--size: 30px" aria-label="Підтвердити достовірність інформації та відсутність шахрайських намірів">
                <svg viewBox="0 0 50 50" aria-hidden="true">
                  <path d="M5 30 L 20 45 L 45 5"></path>
                </svg>
              </label>
            </div>

            <label class="contact-form__consent-text" for="support-consent">
              Підтверджую достовірність наданої інформації та відсутність шахрайських намірів.
            </label>
          </div>

          <button class="contact-send-button" type="submit" [disabled]="submissionState() === 'sending'">
            <span>{{ submissionState() === 'sending' ? 'Надсилання…' : 'Надіслати' }}</span>
            <svg
              class="contact-send-button__icon"
              viewBox="0 0 38 15"
              xmlns="http://www.w3.org/2000/svg"
              fill="currentColor"
              aria-hidden="true"
            >
              <path
                d="M10 7.519l-.939-.344h0l.939.344zm14.386-1.205l-.981-.192.981.192zm1.276 5.509l.537.843.148-.094.107-.139-.792-.611zm4.819-4.304l-.385-.923h0l.385.923zm7.227.707a1 1 0 0 0 0-1.414L31.343.448a1 1 0 0 0-1.414 0 1 1 0 0 0 0 1.414l5.657 5.657-5.657 5.657a1 1 0 0 0 1.414 1.414l6.364-6.364zM1 7.519l.554.833.029-.019.094-.061.361-.23 1.277-.77c1.054-.609 2.397-1.32 3.629-1.787.617-.234 1.17-.392 1.623-.455.477-.066.707-.008.788.034.025.013.031.021.039.034a.56.56 0 0 1 .058.235c.029.327-.047.906-.39 1.842l1.878.689c.383-1.044.571-1.949.505-2.705-.072-.815-.45-1.493-1.16-1.865-.627-.329-1.358-.332-1.993-.244-.659.092-1.367.305-2.056.566-1.381.523-2.833 1.297-3.921 1.925l-1.341.808-.385.245-.104.068-.028.018c-.011.007-.011.007.543.84zm8.061-.344c-.198.54-.328 1.038-.36 1.484-.032.441.024.94.325 1.364.319.45.786.64 1.21.697.403.054.824-.001 1.21-.09.775-.179 1.694-.566 2.633-1.014l3.023-1.554c2.115-1.122 4.107-2.168 5.476-2.524.329-.086.573-.117.742-.115s.195.038.161.014c-.15-.105.085-.139-.076.685l1.963.384c.192-.98.152-2.083-.74-2.707-.405-.283-.868-.37-1.28-.376s-.849.069-1.274.179c-1.65.43-3.888 1.621-5.909 2.693l-2.948 1.517c-.92.439-1.673.743-2.221.87-.276.064-.429.065-.492.057-.043-.006.066.003.155.127.07.099.024.131.038-.063.014-.187.078-.49.243-.94l-1.878-.689zm14.343-1.053c-.361 1.844-.474 3.185-.413 4.161.059.95.294 1.72.811 2.215.567.544 1.242.546 1.664.459a2.34 2.34 0 0 0 .502-.167l.15-.076.049-.028.018-.011c.013-.008.013-.008-.524-.852l-.536-.844.019-.012c-.038.018-.064.027-.084.032-.037.008.053-.013.125.056.021.02-.151-.135-.198-.895-.046-.734.034-1.887.38-3.652l-1.963-.384zm2.257 5.701l.791.611.024-.031.08-.101.311-.377 1.093-1.213c.922-.954 2.005-1.894 2.904-2.27l-.771-1.846c-1.31.547-2.637 1.758-3.572 2.725l-1.184 1.314-.341.414-.093.117-.025.032c-.01.013-.01.013.781.624zm5.204-3.381c.989-.413 1.791-.42 2.697-.307.871.108 2.083.385 3.437.385v-2c-1.197 0-2.041-.226-3.19-.369-1.114-.139-2.297-.146-3.715.447l.771 1.846z"
              ></path>
            </svg>
          </button>
        </div>
        @if (submissionNotice(); as notice) {
          <p class="submission-notice" role="alert">{{ notice }} <button class="submission-manager-link" type="button" aria-haspopup="dialog" (click)="openManager()">Написати менеджеру</button>.</p>
        }
      </form>
      }
    </article>
  </div>
</dialog>
