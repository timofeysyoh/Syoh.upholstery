<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#08090b" />
    <title>Сторінку не знайдено — СЬОХ / Syoh</title>
    <style>
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        min-height: 100svh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 2rem 1.5rem;
        color: #e7ebef;
        background: linear-gradient(150deg, #16181b, #08090b 65%);
        font-family: 'Segoe UI', Arial, sans-serif;
        text-align: center;
      }
      main { width: min(100%, 34rem); }
      .brand { margin: 0 0 3rem; color: #aab4bf; font-size: .875rem; letter-spacing: .12em; }
      .code { margin: 0 0 1rem; color: #75808c; font-size: .875rem; letter-spacing: .2em; }
      h1 { margin: 0; font: 400 clamp(1.8rem, 5vw, 2.7rem)/1.2 Georgia, serif; }
      .description { margin: 1.25rem 0 2rem; color: #aab4bf; line-height: 1.7; }
      a {
        display: inline-flex;
        min-height: 3rem;
        align-items: center;
        padding: .75rem 1.5rem;
        border: 1px solid #ffffff26;
        border-radius: 999px;
        color: #e7ebef;
        background: #ffffff08;
        text-decoration: none;
      }
      a:hover { background: #ffffff12; }
      a:focus-visible { outline: 2px solid #aab4bf; outline-offset: 5px; }
    </style>
  </head>
  <body>
    <main>
      <p class="brand">СЬОХ / Syoh</p>
      <p class="code">404</p>
      <h1>Сторінку не знайдено</h1>
      <p class="description">Можливо, адресу вказано неправильно або сторінка більше не існує.</p>
      <a href="/">На головну</a>
    </main>
  </body>
</html>
